<title>Eilat Turnaround — Cleaning Ops Console</title>
<style>
  /* Palette sampled straight off the Turno reference screenshots:
     page #efeff4, accent #29c2af, ink #3d4465, muted #6b7b8b,
     job chips #fc9835 / #6764eb / #f89cb1 / #1565c0 / #94e59d.

     Deliberately light-only, like the product it is modelled on. `color-scheme: light`
     keeps native controls (selects, date and time pickers, checkboxes) light as well,
     even when the viewer's OS is set to dark. */
  :root {
    color-scheme: light;
    --ground: #efeff4; --surface: #ffffff; --surface-2: #f7f7fa; --surface-3: #ececf1;
    --ink: #3d4465; --ink-2: #6b7b8b; --ink-3: #9aa4b4;
    --line: #e3e3ea; --line-strong: #cbcbd6;
    --accent: #29c2af; --accent-deep: #1c9a8b; --accent-soft: #e2f7f4;
    --danger: #e8443c; --danger-soft: #fdecea;
    --warn: #d5820f; --warn-soft: #fdf2e2;
    --ok: #2f9e5c; --ok-soft: #e7f6ec;
    --villa: #6764eb; --villa-soft: #ecebfd;
    --booking: #ececf1; --booking-ink: #6b7b8b;
    --shadow: 0 1px 2px rgba(61,68,101,.06), 0 4px 14px rgba(61,68,101,.07);
    --shadow-lg: 0 12px 40px rgba(61,68,101,.24);
    --c-mk: #e08a1f; --c-op: #6764eb; --c-yb: #db5f86; --c-rt: #1565c0; --c-ns: #3d9e5f;
    --chip-ink: #ffffff;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Cascadia Mono",
            "Noto Sans Mono", "DejaVu Sans Mono", monospace;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font-family: var(--sans); font-size: 14px; line-height: 1.45;
    -webkit-font-smoothing: antialiased;
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

  /* Numbers, times and money keep their own direction inside Hebrew text. */
  .amt, .tm, .num, .stats, .wa-bubble, .meta { unicode-bidi: isolate; }

  .app { display: flex; min-height: 100vh; align-items: stretch; }

  .sidebar {
    width: 238px; flex: 0 0 238px; background: var(--surface);
    border-inline-end: 1px solid var(--line);
    display: flex; flex-direction: column; gap: 2px; padding: 0 0 20px;
  }
  .brand {
    display: flex; align-items: center; gap: 10px; padding: 20px 18px 22px;
    font-weight: 700; font-size: 16px; letter-spacing: -.01em;
  }
  .brand .mark {
    width: 26px; height: 26px; flex: 0 0 26px; border-radius: 8px; background: var(--accent);
    display: grid; place-items: center; color: var(--chip-ink); font-size: 14px;
  }
  .brand small { display: block; font-weight: 500; font-size: 11px; color: var(--ink-3); letter-spacing: .02em; }

  .nav-label {
    font-size: 10px; text-transform: uppercase; letter-spacing: .09em;
    color: var(--ink-3); font-weight: 600; padding: 14px 18px 6px;
  }
  .nav-item {
    display: flex; align-items: center; gap: 10px; padding: 9px 18px;
    border: 0; border-inline-start: 3px solid transparent; background: none; color: var(--ink-2);
    font: inherit; font-weight: 500; text-align: start; cursor: pointer; width: 100%;
  }
  .nav-item:hover { background: var(--surface-2); color: var(--ink); }
  .nav-item[aria-current="true"] {
    background: var(--surface-2); border-inline-start-color: var(--accent);
    color: var(--ink); font-weight: 600;
  }
  .nav-item .ico { width: 18px; text-align: center; opacity: .85; }
  .nav-item .badge {
    margin-inline-start: auto; background: var(--danger); color: #fff;
    font-size: 11px; font-weight: 700; min-width: 19px; height: 19px;
    padding: 0 5px; border-radius: 10px; display: grid; place-items: center;
  }

  .main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; }

  .topbar {
    background: var(--surface); border-bottom: 1px solid var(--line);
    padding: 14px 22px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  .topbar h1 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -.015em; }
  .topbar .who {
    margin-inline-start: auto; display: flex; align-items: center; gap: 9px;
    color: var(--ink-2); font-size: 13px;
  }
  .avatar {
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--accent-soft); color: var(--accent-deep);
    display: grid; place-items: center; font-weight: 700; font-size: 12px; border: 1px solid var(--line);
  }

  .locale {
    display: flex; border: 1px solid var(--line-strong); border-radius: 8px; overflow: hidden;
  }
  .locale button {
    border: 0; background: var(--surface); color: var(--ink-3);
    font: inherit; font-weight: 700; font-size: 12px; letter-spacing: .04em;
    padding: 6px 11px; cursor: pointer;
  }
  .locale button + button { border-inline-start: 1px solid var(--line); }
  .locale button:hover { background: var(--surface-2); color: var(--ink); }
  .locale button[aria-pressed="true"] { background: var(--accent); color: var(--chip-ink); }

  .toolbar {
    background: var(--surface); border-bottom: 1px solid var(--line);
    padding: 10px 22px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }

  .btn {
    border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
    font: inherit; font-weight: 600; font-size: 13px;
    padding: 7px 13px; border-radius: 7px; cursor: pointer; white-space: nowrap;
  }
  .btn:hover { background: var(--surface-2); }
  .btn-primary { background: var(--accent); border-color: var(--accent); color: var(--chip-ink); }
  .btn-primary:hover { background: var(--accent-deep); border-color: var(--accent-deep); }
  .btn-ghost { border-color: transparent; background: none; color: var(--ink-2); }
  .btn-ghost:hover { background: var(--surface-2); color: var(--ink); }
  .btn-danger { color: var(--danger); border-color: var(--danger); background: var(--danger-soft); }
  .btn-sm { padding: 5px 10px; font-size: 12px; }

  .period { font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
  .period span { color: var(--ink-3); font-weight: 500; }

  .stepper { display: flex; gap: 4px; }
  .stepper button {
    width: 30px; height: 30px; border: 1px solid var(--line-strong);
    background: var(--surface); color: var(--ink-2);
    border-radius: 7px; cursor: pointer; font-size: 13px; line-height: 1;
  }
  .stepper button:hover { background: var(--surface-2); color: var(--ink); }

  select.filter {
    font: inherit; font-size: 13px; padding: 6px 9px; border-radius: 7px;
    border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); max-width: 215px;
  }

  .content { padding: 20px 22px 60px; display: flex; flex-direction: column; gap: 18px; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  .tile {
    background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    padding: 13px 15px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 3px;
  }
  .tile .k { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; font-weight: 700; color: var(--ink-3); }
  .tile .v { font-size: 26px; font-weight: 700; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .tile .n { font-size: 12px; color: var(--ink-2); }
  .tile.accent { background: var(--accent-soft); border-color: transparent; }
  .tile.accent .k, .tile.accent .v { color: var(--accent-deep); }
  .tile.accent .n { color: var(--accent-deep); opacity: .8; }
  .tile.alarm { background: var(--danger-soft); border-color: transparent; }
  .tile.alarm .k, .tile.alarm .v, .tile.alarm .n { color: var(--danger); }
  .tile.caution { background: var(--warn-soft); border-color: transparent; }
  .tile.caution .k, .tile.caution .v, .tile.caution .n { color: var(--warn); }

  .card {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 10px; box-shadow: var(--shadow); overflow: hidden;
  }
  .card-head {
    padding: 13px 16px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .card-head h2 { margin: 0; font-size: 14px; font-weight: 700; letter-spacing: -.005em; }
  .card-head .sub { font-size: 12px; color: var(--ink-3); }
  .card-head .right { margin-inline-start: auto; display: flex; gap: 8px; align-items: center; }

  .month-wrap { overflow-x: auto; }
  .month {
    display: grid; grid-template-columns: repeat(7, minmax(0, 1fr));
    min-width: 960px; border-top: 1px solid var(--line);
  }
  .dow {
    padding: 8px 10px; font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3);
    background: var(--surface-2);
    border-inline-end: 1px solid var(--line); border-bottom: 1px solid var(--line);
  }
  .dow:nth-child(7n) { border-inline-end: 0; }

  .day {
    min-height: 132px;
    border-inline-end: 1px solid var(--line); border-bottom: 1px solid var(--line);
    padding: 6px; display: flex; flex-direction: column; gap: 4px; background: var(--surface);
  }
  .day:nth-child(7n) { border-inline-end: 0; }
  .day.out { background: var(--surface-2); }
  .day.today { background: var(--accent-soft); }
  .day.we { background: var(--surface-2); }
  .day.we.today { background: var(--accent-soft); }
  .day-n {
    display: flex; align-items: center; gap: 6px; font-size: 12px;
    font-weight: 700; color: var(--ink-2); font-variant-numeric: tabular-nums;
  }
  .day.out .day-n { color: var(--ink-3); font-weight: 500; }
  .day.today .day-n { color: var(--accent-deep); }
  .day-n .pill {
    margin-inline-start: auto; font-size: 10px; font-weight: 700; letter-spacing: .04em;
    text-transform: uppercase; padding: 1px 6px; border-radius: 20px;
    background: var(--accent); color: var(--chip-ink);
  }
  .day-n .add {
    margin-inline-start: auto; border: 0; background: none; cursor: pointer; color: var(--ink-3);
    font-size: 15px; line-height: 1; padding: 0 3px; border-radius: 4px; opacity: 0;
  }
  .day:hover .add { opacity: 1; }
  .day-n .add:hover { background: var(--accent); color: var(--chip-ink); }
  .day-n .pill + .add { margin-inline-start: 0; }

  .chip {
    border: 0; font: inherit; text-align: start; width: 100%; display: block;
    border-radius: 6px; padding: 4px 6px; cursor: pointer;
    background: var(--chip-bg, var(--booking)); color: var(--chip-ink); line-height: 1.28;
  }
  .chip:hover { filter: brightness(1.07); }
  .chip .r1 { display: flex; align-items: center; gap: 4px; font-weight: 700; font-size: 11.5px; letter-spacing: -.005em; }
  .chip .r1 .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip .r1 .amt { margin-inline-start: auto; font-family: var(--mono); font-size: 11px; }
  .chip .r2 {
    font-size: 10.5px; opacity: .94; font-family: var(--mono); letter-spacing: -.02em;
    display: flex; gap: 5px; align-items: center;
  }
  .chip .r2 .who {
    font-family: var(--sans); letter-spacing: 0; font-weight: 600;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0;
  }
  .chip .r2 .tm { margin-inline-start: auto; flex: 0 0 auto; }
  .chip .turn, .chip .pair {
    font-size: 9px; font-weight: 800; background: rgba(255,255,255,.28);
    border-radius: 3px; padding: 0 3px; letter-spacing: .03em; flex: 0 0 auto;
  }
  .chip .vil { font-size: 9px; font-weight: 800; opacity: .85; letter-spacing: .04em; flex: 0 0 auto; }
  .chip.gap {
    background: var(--danger-soft); color: var(--danger);
    border: 1px dashed var(--danger); padding: 3px 5px;
  }
  .chip.gap .turn { background: rgba(216,74,74,.16); }
  .chip.done { opacity: .58; }
  .st {
    width: 13px; height: 13px; border-radius: 50%; display: grid; place-items: center;
    font-size: 8px; font-weight: 900; background: rgba(255,255,255,.3); flex: 0 0 13px;
  }
  .more { font-size: 11px; font-weight: 600; color: var(--ink-3); padding: 1px 4px; }

  .agenda { display: none; flex-direction: column; }
  .agenda-day { border-bottom: 1px solid var(--line); padding: 10px 14px; }
  .agenda-day.today { background: var(--accent-soft); }
  .agenda-day h3 {
    margin: 0 0 8px; font-size: 12px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3);
  }
  .agenda-day.today h3 { color: var(--accent-deep); }
  .agenda-day .rows { display: flex; flex-direction: column; gap: 5px; }

  .tl-wrap { overflow-x: auto; }
  .tl { min-width: 1260px; }
  .tl-row { display: grid; grid-template-columns: 246px 1fr; border-bottom: 1px solid var(--line); }
  .tl-row:last-child { border-bottom: 0; }
  .tl-head { background: var(--surface-2); position: sticky; top: 0; z-index: 3; }
  .tl-name {
    padding: 8px 12px; border-inline-end: 1px solid var(--line); background: var(--surface);
    position: sticky; inset-inline-start: 0; z-index: 2;
    display: flex; flex-direction: column; justify-content: center; gap: 2px;
  }
  .tl-head .tl-name { background: var(--surface-2); }
  .tl-name b { font-size: 12.5px; font-weight: 700; }
  .tl-name span { font-size: 11px; color: var(--ink-3); }
  .tl-name .stats { font-family: var(--mono); letter-spacing: -.02em; color: var(--ink-2); }
  .tl-days { display: grid; grid-template-columns: repeat(31, minmax(0, 1fr)); }
  .tl-dh {
    text-align: center; font-size: 10px; font-weight: 700; color: var(--ink-3);
    padding: 6px 0; border-inline-end: 1px solid var(--line); font-variant-numeric: tabular-nums;
  }
  .tl-dh.we { background: var(--surface-3); }
  .tl-dh.td { background: var(--accent); color: var(--chip-ink); }
  .tl-tracks { display: flex; flex-direction: column; gap: 3px; padding: 6px 0; }
  .tl-track {
    display: grid; grid-template-columns: repeat(31, minmax(0, 1fr));
    grid-auto-rows: 15px; position: relative;
  }
  .tl-grid {
    position: absolute; inset: 0; display: grid;
    grid-template-columns: repeat(31, minmax(0, 1fr)); pointer-events: none;
  }
  .tl-grid i { border-inline-end: 1px solid var(--line); }
  .tl-grid i.we { background: var(--surface-3); opacity: .55; }
  .tl-grid i.td { background: var(--accent); opacity: .12; }
  .tl-bar {
    grid-row: 1; height: 15px; border-radius: 8px;
    background: var(--booking); color: var(--booking-ink);
    font-size: 9.5px; font-weight: 700; line-height: 15px; padding: 0 6px;
    overflow: hidden; white-space: nowrap; z-index: 1;
    font-family: var(--mono); letter-spacing: -.02em;
  }
  .tl-clean {
    grid-row: 1; height: 15px; border-radius: 4px; background: var(--chip-bg);
    z-index: 2; border: 0; padding: 0; cursor: pointer; color: var(--chip-ink);
    font-size: 9px; font-weight: 800; display: grid; place-items: center; letter-spacing: -.03em;
  }
  .tl-clean:hover { filter: brightness(1.12); }
  .tl-clean.gap { background: var(--danger-soft); border: 1px dashed var(--danger); color: var(--danger); }

  .tbl-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; min-width: 760px; }
  th {
    text-align: start; font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
    color: var(--ink-3); font-weight: 700; padding: 9px 14px;
    background: var(--surface-2); border-bottom: 1px solid var(--line); white-space: nowrap;
  }
  td { padding: 10px 14px; border-bottom: 1px solid var(--line); font-size: 13px; vertical-align: middle; }
  tbody tr:last-child td { border-bottom: 0; }
  .num { text-align: end; font-family: var(--mono); font-variant-numeric: tabular-nums; }
  tr.pick { cursor: pointer; }
  tr.pick:hover { background: var(--surface-2); }
  tr.pick[aria-selected="true"] { background: var(--accent-soft); }
  tfoot td { font-weight: 700; background: var(--surface-2); border-top: 2px solid var(--line-strong); border-bottom: 0; }

  .who-cell { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: 0 0 9px; background: var(--chip-bg); }
  .sub2 { display: block; font-size: 11.5px; color: var(--ink-3); font-weight: 500; }

  .tag {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 20px; white-space: nowrap;
  }
  .tag.ok { background: var(--ok-soft); color: var(--ok); }
  .tag.warn { background: var(--warn-soft); color: var(--warn); }
  .tag.bad { background: var(--danger-soft); color: var(--danger); }
  .tag.neutral { background: var(--surface-3); color: var(--ink-2); }
  .tag.villa { background: var(--villa-soft); color: var(--villa); }
  .tag.apt { background: var(--accent-soft); color: var(--accent-deep); }

  .feed { display: flex; flex-direction: column; }
  .ev {
    display: flex; gap: 13px; padding: 14px 16px;
    border-bottom: 1px solid var(--line); border-inline-start: 3px solid var(--line-strong);
    align-items: flex-start; flex-wrap: wrap;
  }
  .ev:last-child { border-bottom: 0; }
  .ev.crit { border-inline-start-color: var(--danger); }
  .ev.warn { border-inline-start-color: var(--warn); }
  .ev.info { border-inline-start-color: var(--accent); }
  .ev .body { flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .ev .t { font-weight: 700; font-size: 13.5px; }
  .ev .d { font-size: 12.5px; color: var(--ink-2); }
  .ev .d b { color: var(--ink); font-weight: 600; }
  .ev .meta { font-size: 11px; color: var(--ink-3); font-family: var(--mono); letter-spacing: -.02em; }
  .ev .acts { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }

  .backdrop {
    position: fixed; inset: 0; background: rgba(15,30,38,.55);
    display: grid; place-items: center; padding: 20px; z-index: 50;
  }
  .modal {
    background: var(--surface); border-radius: 12px; box-shadow: var(--shadow-lg);
    width: min(730px, 100%); max-height: 90vh; overflow: auto; border: 1px solid var(--line);
  }
  .modal-head {
    padding: 16px 18px; border-bottom: 1px solid var(--line);
    display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap;
    position: sticky; top: 0; background: var(--surface); z-index: 4;
  }
  .modal-head .titles { flex: 1 1 220px; min-width: 0; }
  .modal-head h2 { margin: 0; font-size: 16px; font-weight: 700; }
  .modal-head .sub { font-size: 12.5px; color: var(--ink-3); }
  .modal-body { padding: 16px 18px; display: flex; flex-direction: column; gap: 16px; }

  .kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
  .kv > div { display: flex; flex-direction: column; gap: 2px; }
  .kv .k { font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em; font-weight: 700; color: var(--ink-3); }
  .kv .v { font-size: 13.5px; font-weight: 600; }

  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(175px, 1fr)); gap: 12px; }
  .fld { display: flex; flex-direction: column; gap: 4px; }
  .fld > span {
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em;
    font-weight: 700; color: var(--ink-3);
  }
  .fld input, .fld select, .fld textarea {
    font: inherit; font-size: 13.5px; padding: 8px 10px; border-radius: 7px;
    border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); width: 100%;
  }
  .fld textarea { min-height: 62px; resize: vertical; }
  .fld input:focus, .fld select:focus, .fld textarea:focus { border-color: var(--accent); outline: none; }
  .check { display: flex; align-items: center; gap: 9px; font-size: 13px; font-weight: 600; }
  .check input { width: 16px; height: 16px; accent-color: var(--accent); }

  .crew {
    display: flex; flex-direction: column; gap: 10px;
    border: 1px solid var(--line); border-radius: 9px; padding: 12px; background: var(--surface-2);
  }
  .crew-head {
    display: flex; align-items: center; gap: 8px;
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .07em;
    font-weight: 700; color: var(--ink-3);
  }
  .crew-row { display: grid; grid-template-columns: 14px minmax(0, 1fr) 124px; gap: 9px; align-items: center; }
  .crew-row .dot { width: 12px; height: 12px; flex: 0 0 12px; border: 1px solid var(--line-strong); }
  .crew-row input, .crew-row select {
    font: inherit; font-size: 13.5px; padding: 8px 10px; border-radius: 7px;
    border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); width: 100%;
  }
  .crew-row input { font-family: var(--mono); text-align: end; }
  .crew-split {
    font-size: 12px; color: var(--ink-2); font-family: var(--mono); letter-spacing: -.02em;
    display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
  }
  @media (max-width: 560px) {
    .crew-row { grid-template-columns: 14px minmax(0, 1fr); }
    .crew-row input { grid-column: 2; }
  }

  .alert { border-radius: 8px; padding: 10px 12px; font-size: 12.5px; }
  .alert.bad { background: var(--danger-soft); color: var(--danger); }

    var todayJobs = CLEANINGS.filter(function (c) { return c.date === TODAY; }).length;

      tile(gaps7 ? "alarm" : "", U.tileGaps, gaps7, gaps7 ? U.tileGapsN : U.tileGapsOk),

  function tile(cls, k, v, n) {
    return '<div class="tile ' + cls + '"><span class="k">' + k + '</span><span class="v">' + v +
      '</span><span class="n">' + n + "</span></div>";

  /* ---------- calendar ---------- */
  var gridStart = new Date(Date.UTC(2026, 6, 26));

  function chip(c) {
    var st = L.status[c.status];
    var villa = PROPS[c.pid].kind === "villa" ? '<span class="vil">' + U.villaShort + "</span>" : "";
    var b2b = c.turnover ? '<span class="turn">' + U.b2b + "</span>" : "";
    if (!c.crew.length) {
      return '<button class="chip gap" data-id="' + c.id + '">' +
        '<span class="r1"><span class="nm">' + esc(P(c.pid).short) + "</span>" + villa + b2b +
        '<span class="amt">' + money(c.rate) + "</span></span>" +
        '<span class="r2"><span class="who">' + U.needsCleaner + "</span>" +
        '<span class="tm">' + fmtTime(c.start) + "</span></span></button>";
    }
    return '<button class="chip' + (c.status === "done" ? " done" : "") + '" data-id="' + c.id +
      '" style="--chip-bg:' + crewBg(c.crew) + '">' +
      '<span class="r1"><span class="nm">' + esc(P(c.pid).short) + "</span>" + villa + b2b +
      (c.crew.length > 1 ? '<span class="pair">×2</span>' : "") +
      '<span class="amt">' + money(jobTotal(c)) + "</span></span>" +
      '<span class="r2"><span class="st">' + statusMark(c.status) + "</span>" +
      '<span class="who">' + crewNames(c) + "</span>" +
      '<span class="tm">' + fmtTime(c.start) + "–" + fmtTime(c.start + c.hrs) + "</span></span></button>";

  function renderMonth() {
    var out = L.dow.map(function (d) { return '<div class="dow">' + d + "</div>"; }).join("");
    for (var i = 0; i < 42; i++) {
      var d = addDays(gridStart, i), key = iso(d), wd = d.getUTCDay();
      var isOut = key.slice(0, 7) !== "2026-08";
      var jobs = CLEANINGS.filter(function (c) { return c.date === key && visible(c); });
      var shown = jobs.slice(0, 3), rest = jobs.length - shown.length;
      out += '<div class="day' + (isOut ? " out" : (wd === 5 || wd === 6 ? " we" : "")) +
        (key === TODAY ? " today" : "") + '">' +
        '<div class="day-n">' + d.getUTCDate() +
        (d.getUTCDate() === 1 ? " " + L.months[d.getUTCMonth()] : "") +
        (key === TODAY ? '<span class="pill">' + U.today + "</span>" : "") +
        '<button class="add" data-new="' + key + '" aria-label="+">+</button></div>' +
        shown.map(chip).join("") +
        (rest > 0 ? '<span class="more">' + U.more + " " + rest + "</span>" : "") + "</div>";
    }
    document.getElementById("month").innerHTML = out;

    var vis = CLEANINGS.filter(visible);
    document.getElementById("cal-sub").textContent =
      L.n(Object.keys(PROPS).length, "properties") + " · " +
      L.n(vis.length, "cleanings") + " " + U.shown + " · " +
      vis.filter(function (c) { return c.crew.length > 1; }).length + " " + U.twoCleaner + " · " +
      vis.filter(function (c) { return c.crew.length === 0; }).length + " " + U.unassigned;
  }

    var out = "";

      var d = new Date(Date.UTC(2026, 7, 1 + i)), key = iso(d);
      var jobs = CLEANINGS.filter(function (c) { return c.date === key && visible(c); });
      if (!jobs.length) continue;
      out += '<div class="agenda-day' + (key === TODAY ? " today" : "") + '">' +
        "<h3>" + L.dateShort(d) + (key === TODAY ? " · " + U.today : "") + "</h3>" +

  /* ---------- timeline ---------- */
  function renderTimeline() {
    var head = '<div class="tl-row tl-head"><div class="tl-name"><b>' + U.tlProperty +
      "</b><span>" + U.august + " 2026</span></div><div class=\"tl-days\">";
    for (var i = 1; i <= 31; i++) {
      var d = new Date(Date.UTC(2026, 7, i)), wd = d.getUTCDay();
      head += '<div class="tl-dh ' + (iso(d) === TODAY ? "td" : (wd === 5 || wd === 6 ? "we" : "")) + '">' + i + "</div>";
    }
    head += "</div></div>";

    var rows = Object.keys(PROPS).filter(propPasses).map(function (pid) {
      var p = PROPS[pid], grid = "";
      for (var i = 1; i <= 31; i++) {
        var d = new Date(Date.UTC(2026, 7, i)), wd = d.getUTCDay();
        grid += '<i class="' + (iso(d) === TODAY ? "td" : (wd === 5 || wd === 6 ? "we" : "")) + '"></i>';
      }
      var bars = STAYS.filter(function (s) {
        return s[0] === pid && s[2] >= "2026-08-01" && s[1] <= "2026-08-31";
      }).map(function (s) {
        var a = s[1] < "2026-08-01" ? 1 : parseInt(s[1].slice(8), 10);
        var b = s[2] > "2026-08-31" ? 31 : parseInt(s[2].slice(8), 10);
        return '<div class="tl-bar" style="grid-column:' + a + "/" + (b + 1) + '">' + s[3].slice(0, 3).toUpperCase() + "</div>";
      }).join("");

      var jobs = CLEANINGS.filter(function (c) { return c.pid === pid; });
      var marks = jobs.filter(visible).map(function (c) {
        var day = parseInt(c.date.slice(8), 10), gap = !c.crew.length;
        var tip = P(pid).addr + " · " + dateLong(c.date) + " · " +
          fmtTime(c.start) + "–" + fmtTime(c.start + c.hrs) + " · " +
          (gap ? U.unassigned : crewNames(c) + " · " + money(jobTotal(c)));
        return '<button class="tl-clean' + (gap ? " gap" : "") + '" data-id="' + c.id +
          '" style="grid-column:' + day + "/" + (day + 1) + (gap ? "" : ";--chip-bg:" + crewBg(c.crew)) +
          '" title="' + esc(tip) + '">' + crewMark(c.crew) + "</button>";
      }).join("");

      var sum = jobs.reduce(function (a, c) { return a + (c.crew.length ? jobTotal(c) : 0); }, 0);
      var nights = STAYS.filter(function (s) { return s[0] === pid; }).reduce(function (a, s) {
        var from = s[1] < "2026-08-01" ? "2026-08-01" : s[1];
        var to = s[2] > "2026-08-31" ? "2026-09-01" : s[2];
        return a + Math.max(0, (new Date(to) - new Date(from)) / 86400000);
      }, 0);

      return '<div class="tl-row"><div class="tl-name"><b>' + esc(P(pid).addr) + "</b>" +
        "<span>" + P(pid).area + " · " + kindOf(pid) + " · " + bedsOf(pid) + "</span>" +
        '<span class="stats">' + L.n(jobs.length, "cleanings") + " · " + p.hrs.toFixed(1) + " " +
        U.msgHours + " · " + money(sum) + " · " + U.tlBooked + " " +
        Math.round(nights / 31 * 100) + "%</span></div>" +
        '<div class="tl-tracks">' +
        '<div class="tl-track"><div class="tl-grid">' + grid + "</div>" + bars + "</div>" +
        '<div class="tl-track"><div class="tl-grid">' + grid + "</div>" + marks + "</div>" +
        "</div></div>";
    }).join("");

    document.getElementById("tl").innerHTML = head + rows;
  }

  /* ---------- reports ---------- */
  function renderReports() {
    var sum = document.getElementById("rep-summary");
    var total = { n: 0, h: 0, m: 0 };

    if (repMode === "cleaner") {
      var rows = Object.keys(COLORS).map(function (cid) {
        var jobs = CLEANINGS.filter(function (c) { return crewIds(c).indexOf(cid) !== -1; });
        var h = jobs.reduce(function (a, c) { return a + c.hrs; }, 0);
        var m = jobs.reduce(function (a, c) {
          var mine = c.crew.filter(function (x) { return x.id === cid; })[0];
          return a + (mine ? mine.pay : 0);
        }, 0);
        var props = {};
        jobs.forEach(function (c) { props[c.pid] = 1; });
        var paired = jobs.filter(function (c) { return c.crew.length > 1; }).length;
        var doneN = jobs.filter(function (c) { return c.status === "done"; }).length;
        total.n += jobs.length; total.h += h; total.m += m;
        return "<tr class='pick' data-pick='" + cid + "' aria-selected='" + (cid === repPick) + "'>" +
          "<td><span class='who-cell'><span class='dot' style='--chip-bg:" + COLORS[cid] + "'></span><b>" +
          cName(cid) + "</b></span></td>" +
          "<td><span class='tag neutral'>" + PHONES[cid] + "</span></td>" +
          "<td class='num'>" + jobs.length + "</td><td class='num'>" + paired + "</td>" +
          "<td class='num'>" + Object.keys(props).length + "</td>" +
          "<td class='num'>" + h.toFixed(1) + "</td><td class='num'>" + money(m) + "</td>" +
          "<td class='num'>" + doneN + " / " + jobs.length + "</td></tr>";
      }).join("");
      sum.innerHTML = "<thead><tr><th>" + U.thCleaner + "</th><th>" + U.thWhatsApp + "</th><th class='num'>" +
        U.thCleanings + "</th><th class='num'>" + U.thPaired + "</th><th class='num'>" + U.thProperties +
        "</th><th class='num'>" + U.thHours + "</th><th class='num'>" + U.thPayout + "</th><th class='num'>" +
        U.thCompleted + "</th></tr></thead><tbody>" + rows + "</tbody>" +
        "<tfoot><tr><td>" + U.total + "</td><td></td><td class='num'>" + total.n + "</td><td class='num'></td>" +
        "<td class='num'>" + Object.keys(PROPS).length + "</td><td class='num'>" + total.h.toFixed(1) +
        "</td><td class='num'>" + money(total.m) + "</td><td class='num'></td></tr></tfoot>";
    } else {
      var prows = Object.keys(PROPS).map(function (pid) {
        var p = PROPS[pid];
        var jobs = CLEANINGS.filter(function (c) { return c.pid === pid; });
        var labour = jobs.reduce(function (a, c) { return a + c.hrs * Math.max(c.crew.length, 1); }, 0);
        var m = jobs.reduce(function (a, c) { return a + (c.crew.length ? jobTotal(c) : 0); }, 0);
        var who = {};
        jobs.forEach(function (c) { crewIds(c).forEach(function (id) { who[id] = 1; }); });
        var gapN = jobs.filter(function (c) { return !c.crew.length; }).length;
        total.n += jobs.length; total.h += labour; total.m += m;
        var dots = Object.keys(who).map(function (cid) {
          return "<span class='dot' style='--chip-bg:" + COLORS[cid] + "' title='" + cName(cid) + "'></span>";
        }).join("");
        return "<tr class='pick' data-pick='" + pid + "' aria-selected='" + (pid === repPick) + "'>" +
          "<td><b>" + esc(P(pid).addr) + "</b><span class='sub2'>" + P(pid).area + "</span></td>" +
          "<td><span class='tag " + (p.kind === "villa" ? "villa" : "apt") + "'>" + kindOf(pid) + "</span></td>" +
          "<td>" + mgrName(p.mgr) + "</td>" +
          "<td class='num'>" + jobs.length + "</td><td class='num'>" + labour.toFixed(1) + "</td>" +
          "<td class='num'>" + money(m) + "</td>" +
          "<td><span class='who-cell'>" + dots + "</span></td>" +
          "<td>" + (gapN ? "<span class='tag bad'>" + gapN + " " + U.open + "</span>"
                         : "<span class='tag ok'>" + U.covered + "</span>") + "</td></tr>";
      }).join("");
      sum.innerHTML = "<thead><tr><th>" + U.thProperty + "</th><th>" + U.thType + "</th><th>" + U.thManager +
        "</th><th class='num'>" + U.thCleanings + "</th><th class='num'>" + U.thLabour +
        "</th><th class='num'>" + U.thCost + "</th><th>" + U.thCleaners + "</th><th>" + U.thCoverage +
        "</th></tr></thead><tbody>" + prows + "</tbody><tfoot><tr><td>" + U.total +
        "</td><td></td><td></td><td class='num'>" + total.n + "</td><td class='num'>" + total.h.toFixed(1) +
        "</td><td class='num'>" + money(total.m) + "</td><td></td><td></td></tr></tfoot>";
    }
    renderDetail();
  }

  function renderDetail() {
    var jobs, title, isCleaner = repMode === "cleaner";
    if (isCleaner) {
      if (!COLORS[repPick]) repPick = "mk";
      jobs = CLEANINGS.filter(function (c) { return crewIds(c).indexOf(repPick) !== -1; });
      title = cName(repPick) + " — " + U.jobLog + " · " + U.period;
    } else {
      if (!PROPS[repPick]) repPick = "P1";
      jobs = CLEANINGS.filter(function (c) { return c.pid === repPick; });
      title = P(repPick).addr + " — " + U.jobLog + " · " + U.period;
    }
    jobs = jobs.slice().sort(function (a, b) { return a.date < b.date ? -1 : 1; });
    document.getElementById("detail-title").textContent = title;

    var h = 0, m = 0;
    var body = jobs.map(function (c) {
      var st = L.status[c.status];
      var mine = c.crew.filter(function (x) { return x.id === repPick; })[0];
      var amount = isCleaner ? (mine ? mine.pay : 0) : (c.crew.length ? jobTotal(c) : c.rate);
      var hours = isCleaner ? c.hrs : c.hrs * Math.max(c.crew.length, 1);
      h += hours; m += amount;
      var second = isCleaner
        ? esc(P(c.pid).addr) + "<span class='sub2'>" + P(c.pid).area + " · " + kindOf(c.pid) +
          (c.crew.length > 1
            ? " · " + U.withWho + " " + c.crew.filter(function (x) { return x.id !== repPick; })
                .map(function (x) { return cName(x.id); }).join(", ")
            : " · " + U.solo) +
          (c.turnover ? " · " + U.b2b : "") + "</span>"
        : (c.crew.length
            ? "<span class='who-cell'>" + c.crew.map(function (x) {
                return "<span class='dot' style='--chip-bg:" + COLORS[x.id] + "'></span>" + cName(x.id) +
                  " <span class='sub2' style='display:inline'>" + money(x.pay) + "</span>";
              }).join(" ") + "</span>"
            : "<span class='tag bad'>" + U.unassigned + "</span>");
      return "<tr><td>" + L.dateShort(dOf(c.date)) + "</td><td>" + second + "</td><td>" +
        fmtTime(c.start) + "–" + fmtTime(c.start + c.hrs) + "</td>" +
        "<td class='num'>" + hours.toFixed(1) + "</td><td class='num'>" + money(amount) +
        "</td><td><span class='tag " + statusCls(c.status) + "'>" + st + "</span></td></tr>";
    }).join("");

    document.getElementById("rep-detail").innerHTML =
      "<thead><tr><th>" + U.thDate + "</th><th>" + (isCleaner ? U.thProperty : U.thCrewCol) + "</th><th>" +
      U.thWindow + "</th><th class='num'>" + (isCleaner ? U.thHours : U.thLabour) + "</th><th class='num'>" +
      (isCleaner ? U.thTheirPay : U.thCost) + "</th><th>" + U.thStatus + "</th></tr></thead><tbody>" +
      (body || "<tr><td colspan='6' style='color:var(--ink-3)'>" + U.noJobs + "</td></tr>") +
      "</tbody><tfoot><tr><td>" + L.n(jobs.length, "cleanings") + "</td><td></td><td></td><td class='num'>" +
      h.toFixed(1) + "</td><td class='num'>" + money(m) + "</td><td></td></tr></tfoot>";
  }

  function statusCls(s) {
    return { done: "ok", running: "warn", confirmed: "ok", sent: "warn", assigned: "neutral", unassigned: "bad" }[s];
  }
  function statusMark(s) {
    return { done: "✓", running: "▶", confirmed: "✓", sent: "!", assigned: "·", unassigned: "!" }[s];
  }

  /* ---------- job modal ---------- */
  function waText(c, member) {
    var mates = (c.crew || []).filter(function (m) { return !member || m.id !== member.id; });
    return U.msgTitle + "\n\n" +
      U.msgAddr + ": " + P(c.pid).addr + "\n" +
      U.msgArea + ": " + P(c.pid).area + " (" + kindOf(c.pid) + ", " + bedsOf(c.pid) + ")\n" +
      U.msgDate + ": " + dateLong(c.date) + "\n" +
      U.msgTime + ": " + fmtTime(c.start) + "–" + fmtTime(c.start + c.hrs) +
        " (" + Number(c.hrs).toFixed(1) + " " + U.msgHours + ")\n" +
      U.msgPay + ": " + money(member ? member.pay : c.rate) + "\n" +
      (member && mates.length ? U.msgWith + ": " + mates.map(function (m) { return cName(m.id); }).join(", ") + "\n" : "") +
      (c.noteText ? U.msgNote + ": " + c.noteText + "\n" : "") +
      "\n" + mgrName(c.mgr) + " " + U.msgMeet;
  }

  function openJob(id) {
    var c = byId(id);
    if (!c) return;
    var note = noteOf(c);
    var ctx = { pid: c.pid, date: c.date, start: c.start, hrs: c.hrs, rate: c.rate,
                mgr: c.mgr, crew: c.crew, noteText: note };

    document.getElementById("m-title").textContent = P(c.pid).addr;
    document.getElementById("m-sub").innerHTML =
      P(c.pid).area + " · " + kindOf(c.pid) + " · " + bedsOf(c.pid) + " · " + dateLong(c.date) +
      (c.turnover ? ' · <span class="tag warn">' + U.b2bWarn + "</span>" : "");

    var sent = c.status !== "assigned" && c.status !== "unassigned";
    var replied = c.status === "confirmed" || c.status === "done" || c.status === "running";

    var crewBlock = c.crew.length
      ? '<div class="who-cell">' + c.crew.map(function (m) {
          return "<span class='tag neutral'><span class='dot' style='--chip-bg:" + COLORS[m.id] +
            "'></span>" + cName(m.id) + " · " + money(m.pay) + "</span>";
        }).join(" ") + "</div>"
      : "";

    var bubbles = c.crew.length
      ? c.crew.map(function (m) {
          return '<div class="wa"><div class="wa-label">' + U.waTo + " " + cName(m.id) + " · " + PHONES[m.id] +
            '</div><div class="wa-bubble">' + esc(waText(ctx, m)) + "</div>" +
            '<div class="wa-cap">' + (replied ? U.waReplied : sent ? U.waWaiting : U.waOnSave) + "</div>" +
            '<div class="wa-btns"><span' + (replied ? ' class="chosen"' : "") + ">" + U.waAccept + "</span>" +
            "<span>" + U.waDecline + "</span></div>" +
            '<div class="track">' +
              step(U.trSent, sent ? "09:02" : null) +
              step(U.trDelivered, sent ? "09:02" : null) +
              step(U.trRead, replied || c.status === "sent" ? "09:11" : null) +
              step(U.trAccepted, replied ? "09:13" : null) +
              step(U.trFinished, c.status === "done" ? "14:05" : null) +
            "</div></div>";
        }).join("")
      : '<div class="wa"><div class="wa-label">' + U.waNothing + "</div>" +
        '<div class="wa-bubble">' + esc(waText(ctx, null)) + "</div>" +
        '<div class="wa-cap">' + U.waWillGo + "</div></div>";

    document.getElementById("m-actions").innerHTML =
      '<button class="btn btn-primary" data-edit="' + c.id + '">' +
        (c.crew.length ? U.mEdit : U.mAssignCrew) + "</button>" +
      (c.crew.length ? '<button class="btn">' + U.mResend + "</button>" : "") +
      '<button class="btn btn-ghost">' + U.mCancel + "</button>";

    document.getElementById("m-body").innerHTML =
      '<div class="kv">' +
        kv(U.mCrew, c.crew.length ? L.n(c.crew.length, "people") : '<span class="tag bad">' + U.mNobody + "</span>") +
        kv(U.mManager, mgrName(c.mgr)) +
        kv(U.mWindow, fmtTime(c.start) + "–" + fmtTime(c.start + c.hrs)) +
        kv(U.mDuration, Number(c.hrs).toFixed(1) + " " + U.msgHours + " " + U.mEach) +
        kv(U.mJobPay, money(jobTotal(c))) +
        kv(U.mStatus, '<span class="tag ' + statusCls(c.status) + '">' + L.status[c.status] + "</span>") +
      "</div>" + crewBlock +
      (note ? '<div class="note"><b>' + U.mNote + ":</b> " + esc(note) + "</div>" : "") +
      "<div>" + bubbles + "</div>";

    document.getElementById("backdrop").hidden = false;
  }

  function kv(k, v) { return '<div><span class="k">' + k + '</span><span class="v">' + v + "</span></div>"; }
  function step(label, time) {
    return '<div><span class="mark' + (time ? "" : " pending") + '">' + (time ? "✓" : "·") + "</span>" +
      label + '<span class="tm">' + (time || "—") + "</span></div>";
  }

  /* ---------- assign form ---------- */
  function openAssign(opts) {
    var c = opts.id ? byId(opts.id) : null;
    editingId = c ? c.id : null;
    payTouched = false;

    var pid = c ? c.pid : (opts.pid || "P1");
    var p = PROPS[pid];

    document.getElementById("a-title").textContent = c ? U.aTitleEdit : U.aTitleNew;
    document.getElementById("a-sub").textContent = c ? U.aSubEdit : U.aSubNew;
    document.getElementById("a-save").textContent = c ? U.aSaveEdit : U.aSave;

    document.getElementById("a-pid").value = pid;
    document.getElementById("a-date").value = c ? c.date : (opts.date || TODAY);
    document.getElementById("a-start").value = fmtTime(c ? c.start : 11.5);
    document.getElementById("a-hrs").value = c ? c.hrs : p.hrs;
    document.getElementById("a-mgr").value = c ? c.mgr : p.mgr;
    document.getElementById("a-rate").value = c ? jobTotal(c) : p.rate;
    document.getElementById("a-note").value = c ? noteOf(c) : "";
    document.getElementById("a-send").checked = true;
    document.getElementById("a-delete").hidden = !c;

    var crew = c ? c.crew : (opts.cleaner ? [{ id: opts.cleaner, pay: 0 }] : []);
    document.getElementById("a-c1").value = crew[0] ? crew[0].id : "";
    document.getElementById("a-c2").value = crew[1] ? crew[1].id : "";
    if (c) {
      document.getElementById("a-p1").value = crew[0] ? crew[0].pay : "";
      document.getElementById("a-p2").value = crew[1] ? crew[1].pay : "";
    } else {
      redistribute();
    }

    syncForm();
    document.getElementById("a-backdrop").hidden = false;
  }

  function selectedCrew() {
    var out = [];
    var c1 = document.getElementById("a-c1").value, c2 = document.getElementById("a-c2").value;
    if (c1) out.push(c1);
    if (c2) out.push(c2);
    return out;
  }

  function redistribute() {
    var total = parseFloat(document.getElementById("a-rate").value) || 0;
    var ids = selectedCrew(), shares = evenSplit(total, ids.length);
    document.getElementById("a-p1").value = ids.length > 0 ? shares[0] : "";
    document.getElementById("a-p2").value = ids.length > 1 ? shares[1] : "";
  }

  function readForm() {
    var pid = document.getElementById("a-pid").value;
    var ids = selectedCrew();
    var pays = [
      parseFloat(document.getElementById("a-p1").value) || 0,
      parseFloat(document.getElementById("a-p2").value) || 0
    ];
    return {
      pid: pid,
      date: document.getElementById("a-date").value,
      start: toH(document.getElementById("a-start").value || "11:30"),
      hrs: parseFloat(document.getElementById("a-hrs").value) || PROPS[pid].hrs,
      crew: ids.map(function (id, i) { return { id: id, pay: pays[i] }; }),
      mgr: document.getElementById("a-mgr").value,
      rate: parseFloat(document.getElementById("a-rate").value) || 0,
      note: document.getElementById("a-note").value.trim(),
      send: document.getElementById("a-send").checked
    };
  }

  function conflicts(f) {
    var out = [], ids = f.crew.map(function (m) { return m.id; });
    if (!f.date) return out;

    if (ids.length === 2 && ids[0] === ids[1]) out.push({ lvl: "bad", txt: U.cSameTwice });

    var end = f.start + f.hrs;
    CLEANINGS.forEach(function (c) {
      if (c.id === editingId || c.date !== f.date) return;
      if (!(f.start < c.start + c.hrs && c.start < end)) return;
      var win = " (" + fmtTime(c.start) + "–" + fmtTime(c.start + c.hrs) + ") ";
      crewIds(c).forEach(function (id) {
        if (ids.indexOf(id) !== -1) {
          out.push({ lvl: "bad", txt: cName(id) + " " + U.cBooked + " " + P(c.pid).addr + win + U.cThatDay });
        }
      });
      if (c.mgr === f.mgr) {
        out.push({ lvl: "warn", txt: mgrName(f.mgr) + " " + U.cMgrBusy + " " + P(c.pid).addr + win + U.cSameTime });
      }
    });

    if (checkins[f.pid + "|" + f.date] && end > 15) {
      out.push({ lvl: "bad", txt: U.cB2B + " " + fmtTime(end) + "." });
    }

    var paid = f.crew.reduce(function (a, m) { return a + m.pay; }, 0);
    if (f.crew.length && Math.abs(paid - f.rate) > 0.5) {
      out.push({ lvl: "warn", txt: U.cShares + " " + money(paid) + ", " + U.cButPay + " " + money(f.rate) +
        ". " + U.cWillUse + " " + money(paid) + "." });
    }

    var band = PROPS[f.pid].kind === "villa" ? [500, 1200] : [200, 500];
    if (f.rate && (f.rate < band[0] || f.rate > band[1])) {
      out.push({ lvl: "warn", txt: kindOf(f.pid) + " " + U.cBand + " " + money(band[0]) + " " + U.cAnd + " " +
        money(band[1]) + " — " + money(f.rate) + " " + U.cOutside });
    }
    return out;
  }

  function syncForm() {
    var f = readForm(), ids = f.crew.map(function (m) { return m.id; });

    document.getElementById("a-dot1").style.setProperty("--chip-bg", ids[0] ? COLORS[ids[0]] : "var(--line-strong)");
    document.getElementById("a-dot2").style.setProperty("--chip-bg", ids[1] ? COLORS[ids[1]] : "var(--line-strong)");

    document.getElementById("a-crew-hint").textContent =
      ids.length === 0 ? U.hintNone
      : ids.length === 1 ? U.hintSolo + " · " + f.hrs.toFixed(1) + " " + U.msgHours
      : U.hintPair + " · " + f.hrs.toFixed(1) + " " + U.hintEach + " · " + (f.hrs * 2).toFixed(1) + " " + U.hintLabour;

    var paid = f.crew.reduce(function (a, m) { return a + m.pay; }, 0);
    document.getElementById("a-split").textContent = ids.length
      ? U.splitJobPay + " " + money(f.rate) + "  =  " + f.crew.map(function (m) {
          return cName(m.id) + " " + money(m.pay);
        }).join("  +  ") + (Math.abs(paid - f.rate) > 0.5 ? "   (" + U.splitShares + " " + money(paid) + ")" : "")
      : U.splitNothing + " " + money(f.rate) + " " + U.splitNothing2;

    document.getElementById("a-warn").innerHTML = conflicts(f).map(function (x) {
      return '<div class="alert ' + x.lvl + '" style="margin-bottom:6px"><b>' +
        (x.lvl === "bad" ? U.conflict : U.heads) + ":</b> " + esc(x.txt) + "</div>";
    }).join("");

    var preview = { pid: f.pid, date: f.date || TODAY, start: f.start, hrs: f.hrs,
                    rate: f.rate, noteText: f.note, mgr: f.mgr, crew: f.crew };
    document.getElementById("a-wa-list").innerHTML =
      (f.crew.length ? f.crew : [null]).map(function (m) {
        return '<div class="wa"><div class="wa-label">' +
          (m ? U.waPreview + " " + cName(m.id) + " · " + PHONES[m.id] : U.waPreviewNone) +
          '</div><div class="wa-bubble">' + esc(waText(preview, m)) + "</div>" +
          '<div class="wa-cap">' + (m ? U.waCapForm : U.waCapNone) + "</div>" +
          (m ? '<div class="wa-btns"><span>' + U.waAccept + "</span><span>" + U.waDecline + "</span></div>" : "") +
          "</div>";
      }).join("");
  }

  var toastTimer = null;
  function toast(msg) {
    var el = document.getElementById("toast");
    if (!el) {
      el = document.createElement("div");
      el.id = "toast";
      el.className = "toast";
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.hidden = true; }, 4500);
  }

  /* ---------- view switching ---------- */
  function show(v) {
    view = v;
    VIEWS.forEach(function (x) { document.getElementById("view-" + x).hidden = x !== v; });
    Array.prototype.forEach.call(document.querySelectorAll(".nav-item"), function (n) {
      n.setAttribute("aria-current", String(n.dataset.view === v));
    });
    document.getElementById("page-title").textContent = U[v];
    document.getElementById("tiles").hidden = (v === "reports" || v === "properties" || v === "cleaners");
    document.getElementById("date-controls").hidden =
      (v === "properties" || v === "cleaners" || v === "reports");
  }

  function renderAll() {
    renderTiles(); renderMonth(); renderAgenda(); renderLegend();
    renderTimeline(); renderProps(); renderCleaners(); renderReports();
  }

  function setLocale(code) {
    if (!DICT[code] || code === LOC) return;
    LOC = code; L = DICT[code]; U = L.ui;
    renderShell();
    renderAll();
    show(view);
  }

  /* ---------- events (all delegated, so re-rendering the shell is safe) ---------- */
  document.addEventListener("click", function (e) {
    var t = e.target;
    if (!t || !t.closest) return;

    var loc = t.closest("[data-loc]");
    if (loc) { setLocale(loc.dataset.loc); return; }

    var addBtn = t.closest("[data-new]");
    if (addBtn) { openAssign({ date: addBtn.dataset.new }); return; }

    var propBtn = t.closest("[data-new-prop]");
    if (propBtn) { openAssign({ pid: propBtn.dataset.newProp, date: TODAY }); return; }

    var clnBtn = t.closest("[data-new-cleaner]");
    if (clnBtn) { openAssign({ cleaner: clnBtn.dataset.newCleaner, date: TODAY }); return; }

    var editBtn = t.closest("[data-edit]");
    if (editBtn) {
      document.getElementById("backdrop").hidden = true;
      openAssign({ id: editBtn.dataset.edit });
      return;
    }

    if (t.id === "new-cleaning") { openAssign({ date: TODAY }); return; }

    var nav = t.closest("[data-view]");
    if (nav) { show(nav.dataset.view); return; }

    var chipEl = t.closest("[data-id]");
    if (chipEl) { openJob(chipEl.dataset.id); return; }

    var row = t.closest("[data-pick]");
    if (row) { repPick = row.dataset.pick; renderReports(); return; }

    if (t.id === "rep-by-cleaner" || t.id === "rep-by-prop") {
      repMode = t.id === "rep-by-cleaner" ? "cleaner" : "property";
      repPick = repMode === "cleaner" ? "mk" : "P1";
      document.getElementById("rep-by-cleaner").setAttribute("aria-pressed", String(repMode === "cleaner"));
      document.getElementById("rep-by-prop").setAttribute("aria-pressed", String(repMode !== "cleaner"));
      renderReports();
      return;
    }

    if (t.id === "m-close" || t.id === "backdrop") { document.getElementById("backdrop").hidden = true; return; }
    if (t.id === "a-close" || t.id === "a-cancel" || t.id === "a-backdrop") {
      document.getElementById("a-backdrop").hidden = true;
      editingId = null;
      return;
    }
    if (t.id === "a-delete") {
      if (!editingId) return;
      CLEANINGS = CLEANINGS.filter(function (c) { return c.id !== editingId; });
      editingId = null;
      document.getElementById("a-backdrop").hidden = true;
      renderAll();
      toast(U.tDeleted);
    }
  });

  document.addEventListener("input", function (e) {
    if (!e.target || !e.target.id) return;
    if (e.target.id.indexOf("a-") !== 0) return;
    if (e.target.id === "a-p1" || e.target.id === "a-p2") payTouched = true;
    if (e.target.id === "a-rate" && !payTouched) redistribute();
    syncForm();
  });

  document.addEventListener("change", function (e) {
    var id = e.target && e.target.id;
    if (!id) return;
    if (id === "f-cleaner") {
      filterCleaner = e.target.value;
      renderMonth(); renderAgenda(); renderTimeline();
      return;
    }
    if (id === "f-type") {
      filterType = e.target.value;
      renderMonth(); renderAgenda(); renderTimeline();
      return;
    }
    if (id.indexOf("a-") !== 0) return;
    if (id === "a-pid") {
      var p = PROPS[document.getElementById("a-pid").value];
      document.getElementById("a-hrs").value = p.hrs;
      document.getElementById("a-rate").value = p.rate;
      document.getElementById("a-mgr").value = p.mgr;
      payTouched = false;
      redistribute();
    }
    if (id === "a-c1" || id === "a-c2") { payTouched = false; redistribute(); }
    syncForm();
  });

  document.addEventListener("submit", function (e) {
    if (!e.target || e.target.id !== "a-form") return;
    e.preventDefault();
    var f = readForm();
    var newId = f.pid + "|" + f.date;

    if (editingId && editingId !== newId) {
      CLEANINGS = CLEANINGS.filter(function (c) { return c.id !== editingId; });
    }
    var c = byId(newId);
    if (!c) { c = { id: newId, noteKey: newId }; CLEANINGS.push(c); }

    c.pid = f.pid; c.date = f.date; c.start = f.start; c.hrs = f.hrs;
    c.crew = f.crew; c.mgr = f.mgr; c.note = f.note;
    c.rate = f.crew.length ? f.crew.reduce(function (a, m) { return a + m.pay; }, 0) : f.rate;
    c.turnover = !!checkins[newId];
    c.status = !f.crew.length ? "unassigned" : (f.send ? "sent" : "assigned");

    editingId = null;
    document.getElementById("a-backdrop").hidden = true;
    renderAll();

    toast(!f.crew.length ? U.tNoCrew
      : U.tSaved + " " + (f.send
          ? U.tSent + " " + f.crew.map(function (m) { return cName(m.id); }).join(" " + U.tAnd + " ")
          : U.tNotSent));
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      document.getElementById("backdrop").hidden = true;
      document.getElementById("a-backdrop").hidden = true;
      editingId = null;
    }
  });

  renderShell();
  renderAll();
  show("calendar");
})();
</script>
